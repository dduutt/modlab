name: Windows release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Disable Windows Defender for Build Speed
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "${{ github.workspace }}", "C:\Users\runneradmin\.cargo" -ErrorAction SilentlyContinue

      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: |
          $config = Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($config.version)") {
            throw "Tag $env:GITHUB_REF_NAME must match application version v$($config.version)."
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: "windows-tauri-release"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows executables
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --ci --target x86_64-pc-windows-msvc --bundles nsis

      - name: Prepare release assets
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $version = $config.version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $title = "Modlab $version"
          } else {
            $tag = "windows-v$version-$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
            $title = "Modlab $version - Windows build $env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "RELEASE_TITLE=$title" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $output = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          Copy-Item -LiteralPath "$output/modlab.exe" -Destination release-assets/Modlab-windows-x64.exe
          $installers = @(Get-ChildItem -LiteralPath "$output/bundle/nsis" -Filter '*.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)." }
          Copy-Item -LiteralPath $installers[0].FullName -Destination release-assets/Modlab-windows-x64-setup.exe

          # Copy updater artifacts (zip, sig)
          $updaterArtifacts = @(Get-ChildItem -Path "$output", "$output/bundle/nsis" -Include '*.zip', '*.sig' -Recurse -File -ErrorAction SilentlyContinue)
          foreach ($artifact in $updaterArtifacts) {
            Copy-Item -LiteralPath $artifact.FullName -Destination release-assets/ -Force
          }

          # Generate latest.json manifest for Tauri v2 updater
          $sigFile = Get-ChildItem -LiteralPath "$output/bundle/nsis" -Filter '*.sig' -File | Select-Object -First 1
          if ($sigFile) {
            $sigContent = (Get-Content -LiteralPath $sigFile.FullName -Raw).Trim()
            $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            $manifest = @{
              version = $version
              notes = "Modlab v$version"
              pub_date = $pubDate
              platforms = @{
                "windows-x86_64" = @{
                  signature = $sigContent
                  url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Modlab-windows-x64-setup.exe"
                }
              }
            } | ConvertTo-Json -Depth 5
            Set-Content -LiteralPath release-assets/latest.json -Value $manifest -Encoding utf8
          }

          Get-ChildItem -LiteralPath release-assets -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath release-assets/SHA256SUMS.txt -Encoding utf8
          @"
          ## Windows x64
          - **Modlab-windows-x64-setup.exe**: Installer (recommended). Installs WebView2 if needed; internet access may be required.
          - **Modlab-windows-x64.exe**: Standalone executable. Requires Microsoft Edge WebView2 Runtime.
          - **SHA256SUMS.txt**: Download checksums.

          Commit: $env:GITHUB_SHA
          Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem -LiteralPath release-assets -File | ForEach-Object { $_.FullName })
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $env:RELEASE_TITLE --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
          "Download: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY

      - name: Preheat Update Cache
        run: |
          Write-Host "Preheating edge cache at update.dduu.cloud..."
          try {
            Invoke-WebRequest -Uri "https://update.dduu.cloud/dduutt/modlab/latest.json" -Method Head -TimeoutSec 10 -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Edge cache preheat ping completed."
          }
